<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bump the ?v= on every icon when the artwork changes. Browsers cache
         favicons far more aggressively than normal assets, and will otherwise
         keep serving the old mark from a previous deploy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>jet2holiday — the group trip that everyone says yes to</title>
    <!-- Apply the stored theme before first paint. App.jsx sets data-theme in an
         effect, which is post-paint, so without this every dark-mode cold load
         flashes the light theme for a frame. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* private mode: fall through to the light default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
